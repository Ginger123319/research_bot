# =============================================================================
# multi_exp_compare.py 外部 YAML 配置模版
# =============================================================================
#
# 完整工作流说明见：configs/analysis/README.md
#
# 用法（从项目根目录执行）：
#   source third_party/llm-benchmark/.venv/bin/activate
#   python3 -m llm_benchmark.analysis.analysis.multi_exp_compare \
#       --config configs/analysis/your_exp.yaml
#
# 命名规范：configs/analysis/<model>_<deploy>_<date>.yaml
#   例：tianji_4tp_20260311.yaml
#       ziwei_tp8_vs_tp4_20260310.yaml
#
# 路径说明：
#   dir / output_dir 支持相对路径（相对于运行命令时的当前目录）。
#   推荐从项目根目录运行，直接写 logs/xxx 和 results/xxx 即可，无需绝对路径。
#   项目根目录下 logs/ 是共享 benchmark 结果（NFS），results/ 是本地分析输出目录。
#
# =============================================================================


# -----------------------------------------------------------------------------
# [必填] 实验分组
#
# 单组：找拐点（单一部署配置的 QPS 扫描）
# 多组：对比不同部署方案（如 TP8 vs TP4，TP vs DP）
#
# dir：benchmark 脚本输出的日志目录（logs/<exp_dir_name>/）
#       每次 QPS 扫描会在此目录下生成多个 *.csv 文件，每个文件对应一个 QPS 档位
# -----------------------------------------------------------------------------
groups:
  - label: "模型名 部署配置（图例显示，如 ziwei-32b TP8）"
    dir: "logs/your_exp_dir"
    # file_pattern: "*data600*"   # [可选] 文件名过滤，仅含该字符串的 CSV 参与分析
    #                             # 用于同目录下有多组数据时区分，不填则匹配所有 *.csv

  # 多组对比示例（取消注释）：
  # - label: "TP4"
  #   dir: "logs/your_4tp_exp_dir"


# -----------------------------------------------------------------------------
# [必填] X 轴维度
#
# request_rate    : 以请求速率（RPS）为 X 轴  ← 最常用，QPS 拐点扫描
# max_concurrency : 以最大并发数为 X 轴        ← 并发扫描实验时使用
# -----------------------------------------------------------------------------
x_key: request_rate


# -----------------------------------------------------------------------------
# [必填] 输出目录
#
# 推荐写法（相对路径，从项目根目录运行时有效）：
#   results/<model>_<deploy>_<date>
#
# 目录不存在时自动创建；生成的 HTML 图表 + REPORT.md 均放入此目录
# -----------------------------------------------------------------------------
output_dir: "results/model_deploy_date"


# -----------------------------------------------------------------------------
# [可选] SLA 配置
#
# 不填（整块注释掉）则使用通用默认值：
#   ttfs_p90: 1.5s | e2e_p90: 150s | success_rate: 99%
#
# 模型特定场景按需覆盖，重点关注以下两类调整：
#   1. 短时延模型（如 tianji 安全检测）：e2e_p90 收紧至 0.4（400ms）
#   2. 长文本生成模型：e2e_p90 可放宽至 180s 或更高
# -----------------------------------------------------------------------------
sla:
  ttfs_p90: 1.5          # 首句延迟 P90 上限（秒）。通用基准 1.5s
  e2e_p90: 150.0         # 完整响应 P90 上限（秒）。通用基准 150s；短输出模型可收紧
  success_rate: 0.99     # 请求成功率下限（0~1）。低于此视为超过拐点

  # [可选] 模型特定额外指标（不填则不启用）
  # 可叠加任意数量的自定义百分位检查，所有条件均满足才判为 PASS
  #
  # custom:
  #   - metric: e2e        # 延迟指标名：ttft / ttfs / e2e / tpot / user_tpot
  #     percentile: 95     # 百分位数（整数）
  #     limit: 0.4         # 上限（秒）
  #     label: "tianji E2E P95"   # 打印时显示的标签
  #
  #   - metric: ttft
  #     percentile: 99
  #     limit: 2.0
  #     label: "TTFT P99 严格"
