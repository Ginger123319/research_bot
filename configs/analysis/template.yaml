# =============================================================================
# multi_exp_compare.py 外部 YAML 配置模版
# =============================================================================
#
# 用法：
#   cd .../llm-benchmark
#   .venv/bin/python3 -m llm_benchmark.analysis.analysis.multi_exp_compare \
#       --config configs/your_exp.yaml
#
# 命名规范：configs/<model>_<deploy>_<date>.yaml
#   例：configs/tianji_4tp_20260311.yaml
#       configs/ziwei_tp8_vs_tp4_20260310.yaml
#
# =============================================================================


# -----------------------------------------------------------------------------
# [必填] 实验分组
#
# 单组：找拐点（单一部署配置）
# 多组：对比不同部署方案（如 TP8 vs TP4，tp vs dp）
# -----------------------------------------------------------------------------
groups:
  - label: "组名（图例显示，建议含模型+配置，如 ziwei-32b TP8）"
    dir: "/绝对路径/到/logs/exp_dir"
    # file_pattern: "*data600*"   # [可选] 文件名过滤，仅含该字符串的 CSV 参与分析
    #                             # 用于同目录下有多组数据时区分，不填则匹配所有 *.csv

  # 多组示例（取消注释）：
  # - label: "TP4"
  #   dir: "/path/to/logs/4tp_exp"


# -----------------------------------------------------------------------------
# [必填] X 轴维度
#
# request_rate    : 以请求速率（QPS）为 X 轴  ← 常用，QPS 拐点扫描
# max_concurrency : 以最大并发数为 X 轴        ← 并发扫描实验时使用
# -----------------------------------------------------------------------------
x_key: request_rate


# -----------------------------------------------------------------------------
# [必填] 输出目录
#
# 规范：results/<model>_<deploy>_<date>
# 目录不存在时自动创建；HTML + REPORT.md 均放入此目录
# -----------------------------------------------------------------------------
output_dir: "/mnt/ai-infra/users/wnd/workspace/execute/guofan/results/model_deploy_date"


# -----------------------------------------------------------------------------
# [可选] SLA 配置
#
# 不填（整块注释掉）则使用通用默认值：
#   ttfs_p90: 1.5s | e2e_p90: 150s | success_rate: 99%
#
# 模型特定场景按需覆盖，重点关注以下两类调整：
#   1. 短时延模型（如 tianji 安全检测）：e2e_p90 收紧至 0.4（400ms）
#   2. 长文本生成模型：e2e_p90 可放宽至 180s 或更高
# -----------------------------------------------------------------------------
sla:
  ttfs_p90: 1.5          # 首句延迟 P90 上限（秒）。通用基准 1.5s
  e2e_p90: 150.0         # 完整响应 P90 上限（秒）。通用基准 150s；短输出模型可收紧
  success_rate: 0.99     # 请求成功率下限（0~1）。低于此视为超过拐点

  # [可选] 模型特定额外指标（不填则不启用）
  # 可叠加任意数量的自定义百分位检查，所有条件均满足才判为 PASS
  #
  # custom:
  #   - metric: e2e        # 延迟指标名：ttft / ttfs / e2e / tpot / user_tpot
  #     percentile: 95     # 百分位数（整数）
  #     limit: 0.4         # 上限（秒）
  #     label: "tianji E2E P95"   # 打印时显示的标签
  #
  #   - metric: ttft
  #     percentile: 99
  #     limit: 2.0
  #     label: "TTFT P99 严格"
